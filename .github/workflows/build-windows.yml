name: Build Windows EXE

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Generate icon
        run: python make_icon.py

      - name: Locate faster-whisper assets
        id: fw
        shell: pwsh
        run: |
          $path = python -c "import faster_whisper, os; print(os.path.dirname(faster_whisper.__file__))"
          "assets=$path" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build PyInstaller app
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onedir `
            --windowed `
            --name freewispr-swedish `
            --icon "assets/icon.ico" `
            --hidden-import=faster_whisper `
            --hidden-import=sounddevice `
            --hidden-import=keyboard `
            --hidden-import=pystray._win32 `
            --hidden-import=keyring.backends.Windows `
            --add-data "${{ steps.fw.outputs.assets }}\assets;faster_whisper\assets" `
            main.py

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: freewispr-swedish-windows
          path: dist/freewispr-swedish/
          if-no-files-found: error
          retention-days: 14
