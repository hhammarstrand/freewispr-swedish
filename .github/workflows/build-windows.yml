name: Build Windows EXE

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write   # behövs för att publicera/uppdatera rolling release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Generate icon
        run: python make_icon.py

      - name: Locate faster-whisper assets
        id: fw
        shell: pwsh
        run: |
          $path = python -c "import faster_whisper, os; print(os.path.dirname(faster_whisper.__file__))"
          "assets=$path" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Locate customtkinter assets
        id: ctk
        shell: pwsh
        run: |
          $path = python -c "import customtkinter, os, sys; print(os.path.dirname(customtkinter.__file__))"
          "pkg=$path" >> $env:GITHUB_OUTPUT

      - name: Build PyInstaller app
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onedir `
            --windowed `
            --name freewispr-swedish `
            --icon "assets/icon.ico" `
            --hidden-import=faster_whisper `
            --hidden-import=sounddevice `
            --hidden-import=keyboard `
            --hidden-import=pystray._win32 `
            --hidden-import=keyring.backends.Windows `
            --hidden-import=customtkinter `
            --add-data "${{ steps.fw.outputs.assets }}\assets;faster_whisper\assets" `
            --add-data "${{ steps.ctk.outputs.pkg }};customtkinter" `
            main.py

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: freewispr-swedish-windows
          path: dist/freewispr-swedish/
          if-no-files-found: error
          retention-days: 14

      - name: Package release zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $zip = "freewispr-swedish-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/freewispr-swedish/*" -DestinationPath $zip
          Get-ChildItem $zip | Format-List

      - name: Publish rolling 'latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Senaste bygge (master)
          body: |
            Automatiskt bygge från senaste lyckade Actions-körning på `master`.

            - Commit: ${{ github.sha }}
            - Workflow: [Build Windows EXE](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Skapad: ${{ github.event.head_commit.timestamp }}

            Zippen nedan innehåller `freewispr-swedish.exe` plus alla beroenden.
            Packa upp och kör `freewispr-swedish.exe`.
          files: freewispr-swedish-windows.zip
          prerelease: true
          target_commitish: ${{ github.sha }}
