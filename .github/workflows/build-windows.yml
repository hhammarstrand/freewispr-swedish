name: Build Windows EXE

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Only one run per ref at a time: a new push cancels an in-progress run for the
# same branch/PR. Prevents stale/hung runs from piling up and blocking merges.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    # Hard cap so a hung step (e.g. a stalled download or PyInstaller) fails
    # fast instead of running until GitHub's 6-hour default and blocking the
    # required check indefinitely.
    timeout-minutes: 30

    permissions:
      contents: write   # behövs för att publicera/uppdatera rolling release

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          # setuptools 65.5.0 has CVE-2024-6345 (RCE via package_index)
          # and PYSEC-2025-49 (ReDoS). Force a current version before
          # touching requirements so pyinstaller doesn't pull the old one.
          python -m pip install --upgrade "setuptools>=78.1.1"
          python -m pip install -r requirements.txt pyinstaller pytest pytest-timeout

      - name: Generate icon
        timeout-minutes: 2
        run: python make_icon.py

      - name: Locate faster-whisper assets
        id: fw
        shell: pwsh
        timeout-minutes: 2
        run: |
          $path = python -c "import faster_whisper, os; print(os.path.dirname(faster_whisper.__file__))"
          "assets=$path" >> $env:GITHUB_OUTPUT

      - name: Run tests
        # Per-test timeout (thread method dumps a traceback of the hung test) +
        # a hard step cap. On the Windows runner tkinter/PIL/pystray are real,
        # so GUI tests that are skipped on the headless Linux dev box actually
        # run here; -p no:cacheprovider and faulthandler make any stall visible
        # and bounded instead of hanging the job until the global timeout.
        timeout-minutes: 8
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest tests/ -q -p no:cacheprovider --timeout=120 --timeout-method=thread

      - name: Lint with ruff
        timeout-minutes: 3
        run: |
          python -m pip install ruff
          ruff check . --select E,F,W --ignore E501

      - name: Audit dependencies
        timeout-minutes: 5
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict

      - name: Locate customtkinter assets
        id: ctk
        shell: pwsh
        timeout-minutes: 2
        run: |
          $path = python -c "import customtkinter, os, sys; print(os.path.dirname(customtkinter.__file__))"
          "pkg=$path" >> $env:GITHUB_OUTPUT

      - name: Build PyInstaller app
        shell: pwsh
        timeout-minutes: 12
        run: |
          python -m PyInstaller `
            --onedir `
            --windowed `
            --name freewispr-swedish `
            --icon "assets/icon.ico" `
            --hidden-import=faster_whisper `
            --hidden-import=sounddevice `
            --hidden-import=keyboard `
            --hidden-import=pystray._win32 `
            --hidden-import=keyring.backends.Windows `
            --hidden-import=customtkinter `
            --hidden-import=huggingface_hub `
            --collect-submodules=ui `
            --add-data "${{ steps.fw.outputs.assets }}\assets;faster_whisper\assets" `
            --add-data "${{ steps.ctk.outputs.pkg }};customtkinter" `
            main.py

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: freewispr-swedish-windows
          path: dist/freewispr-swedish/
          if-no-files-found: error
          retention-days: 14

      - name: Package release zip
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $zip = "freewispr-swedish-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/freewispr-swedish/*" -DestinationPath $zip
          Get-ChildItem $zip | Format-List

      - name: Publish rolling 'latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: latest
          name: Senaste bygge (master)
          body: |
            Automatiskt bygge från senaste lyckade Actions-körning på `master`.

            - Commit: ${{ github.sha }}
            - Workflow: [Build Windows EXE](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Skapad: ${{ github.event.head_commit.timestamp }}

            Zippen nedan innehåller `freewispr-swedish.exe` plus alla beroenden.
            Packa upp och kör `freewispr-swedish.exe`.
          files: freewispr-swedish-windows.zip
          prerelease: true
          target_commitish: ${{ github.sha }}

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          name: ${{ github.ref_name }}
          body: |
            Versionerad release ${{ github.ref_name }}.

            - Commit: ${{ github.sha }}
            - Workflow: [Build Windows EXE](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Se [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
            för fullständiga ändringar i denna release.

            Zippen nedan innehåller `freewispr-swedish.exe` plus alla beroenden.
            Packa upp och kör `freewispr-swedish.exe`.
          files: freewispr-swedish-windows.zip
          prerelease: false
          draft: false
