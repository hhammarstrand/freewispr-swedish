name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Trigger only when the bot is explicitly mentioned. This avoids running
# the action on every comment in the repo (cost + noise).
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    # Least-privilege: only what the action needs. contents:read for code
    # inspection, pull-requests:write so Claude can post review comments,
    # issues:write so it can reply on issues. id-token:write is required for
    # the action's OIDC token exchange.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Allow the model to run tests and lint locally on the runner so
          # @claude can verify its own changes before posting suggestions.
          allowed_tools: |
            Bash(python -m pytest tests/ -q)
            Bash(ruff check . --select E,F,W --ignore E501)
            Bash(git diff)
            Bash(git log --oneline -20)
          # Match the repo's house rules: Swedish UI text, no leaking
          # secrets via logs, use existing helpers like sanitize_output()
          # and url_security.
          system_prompt_addendum: |
            This is a Swedish dictation app. When suggesting changes:
            - User-facing strings (status, errors, indicator) MUST be in Swedish with å/ä/ö.
            - Internal logs, code comments and commit messages can be English.
            - Never bypass consent gates (llm_privacy_accepted, transcription_privacy_accepted).
            - Use sanitize_output() from text_sanitize.py for any text that lands in the user's clipboard.
            - Use url_security helpers for URL validation.
            - Don't log API keys or full transcripts. Metadata only (length, latency, model).
            - Pin GitHub Actions to SHA (see existing build-windows.yml for the style).
