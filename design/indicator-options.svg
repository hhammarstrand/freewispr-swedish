      <path d="M33 12 A15 15 0 0 1 48 28" fill="none" stroke="#006AA7" stroke-width="2.5" stroke-linecap="round"/>
      <text x="67" y="33" class="label">Transkriberar</text>
    </g>
    <g transform="translate(890,39)">
      <rect class="pill" width="213" height="54" rx="20"/>
      <circle cx="27" cy="27" r="4" fill="#006AA7"/>
      <circle cx="38" cy="20" r="3" fill="#7F9B55"/>
      <circle cx="49" cy="29" r="4" fill="#FECC02"/>
      <path d="M27 27 L38 20 L49 29" fill="none" stroke="#3c4656" stroke-width="1.5"/>
      <text x="67" y="33" class="label">LLM-granskar</text>
    </g>
  </g>

  <!-- Option 3 -->
  <g transform="translate(70,465)">
    <rect class="card" width="1260" height="145" rx="24"/>
    <text x="28" y="36" class="title" font-size="20">3. Studio Meter</text>
    <text x="28" y="61" class="desc">Mer audio/professionellt. Lyssnar känns tydligt live, processlägen blir ren progress.</text>
    <g transform="translate(420,39)">
      <rect class="pill" width="172" height="54" rx="20"/>
      <rect x="18" y="18" width="34" height="18" rx="9" fill="#10151d" stroke="#293241"/>
      <rect x="24" y="25" width="3" height="8" rx="1.5" fill="#006AA7"/>
      <rect x="31" y="21" width="3" height="16" rx="1.5" fill="#006AA7"/>
