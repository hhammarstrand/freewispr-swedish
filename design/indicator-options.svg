      <rect x="19" y="25" width="38" height="4" rx="2" fill="#2b3340"/>
      <rect x="19" y="25" width="24" height="4" rx="2" fill="#006AA7"/>
      <rect x="44" y="25" width="8" height="4" rx="2" fill="#FECC02"/>
      <text x="72" y="33" class="label">Transkriberar</text>
    </g>
    <g transform="translate(890,39)">
      <rect class="pill" width="220" height="54" rx="20"/>
      <path d="M20 33 H32 L36 21 L42 33 H55" fill="none" stroke="#006AA7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M47 33 H57" fill="none" stroke="#FECC02" stroke-width="2.3" stroke-linecap="round"/>
      <text x="72" y="33" class="label">LLM-granskar</text>
    </g>
  </g>

  <!-- Option 4 -->
  <g transform="translate(70,635)">
    <rect class="card" width="1260" height="145" rx="24"/>
    <text x="28" y="36" class="title" font-size="20">4. Glass Rail</text>
    <text x="28" y="61" class="desc">Elegant och något mer “designad”. En tunn ljusrail bär all feedback.</text>
    <g transform="translate(420,39)">
      <rect class="pill" width="170" height="54" rx="20"/>
      <path d="M19 27 H55" stroke="#283443" stroke-width="7" stroke-linecap="round"/>
      <path d="M22 27 H39" stroke="#006AA7" stroke-width="7" stroke-linecap="round"/>
      <path d="M40 27 H50" stroke="#FECC02" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
