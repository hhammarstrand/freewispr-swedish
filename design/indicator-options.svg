      <path d="M39 27 H53" stroke="#FECC02" stroke-width="7" stroke-linecap="round"/>
      <text x="72" y="33" class="label">Transkriberar</text>
    </g>
    <g transform="translate(890,39)">
      <rect class="pill" width="218" height="54" rx="20"/>
      <path d="M20 27 H56" stroke="#283443" stroke-width="7" stroke-linecap="round"/>
      <circle cx="27" cy="27" r="4" fill="#006AA7"/>
      <circle cx="39" cy="27" r="4" fill="#7F9B55"/>
      <circle cx="51" cy="27" r="4" fill="#FECC02"/>
      <text x="72" y="33" class="label">LLM-granskar</text>
    </g>
  </g>

  <!-- Option 5 -->
  <g transform="translate(70,805)">
    <rect class="card" width="1260" height="145" rx="24"/>
    <text x="28" y="36" class="title" font-size="20">5. Micro Glyph</text>
    <text x="28" y="61" class="desc">Brandad men stillsam: små symboler snarare än animationseffekter. Mest minimalistisk.</text>
    <g transform="translate(420,39)">
      <rect class="pill" width="168" height="54" rx="20"/>
      <path d="M35 16 v16 a7 7 0 0 1 -14 0 V16 a7 7 0 0 1 14 0Z" fill="none" stroke="#006AA7" stroke-width="2.2"/>
      <path d="M18 30 a10 10 0 0 0 20 0" fill="none" stroke="#FECC02" stroke-width="2.2" stroke-linecap="round"/>
      <text x="67" y="33" class="label">Lyssnar</text>
    </g>
    <g transform="translate(635,39)">
      <rect class="pill" width="216" height="54" rx="20"/>
      <rect x="21" y="17" width="26" height="20" rx="8" fill="none" stroke="#006AA7" stroke-width="2"/>
      <path d="M27 27 H42" stroke="#FECC02" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M34 20 v14" stroke="#7F9B55" stroke-width="1.8" stroke-linecap="round"/>
      <text x="68" y="33" class="label">Transkriberar</text>
    </g>
    <g transform="translate(890,39)">
      <rect class="pill" width="216" height="54" rx="20"/>
      <path d="M25 32 L34 18 L43 32" fill="none" stroke="#006AA7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 28 H39" stroke="#FECC02" stroke-width="2" stroke-linecap="round"/>
