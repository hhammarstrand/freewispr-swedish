<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" width="100%" height="100%">
  <!-- Definitions of all style classes, filters, and gradients -->
  <defs>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 22px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 400; font-size: 13px; fill: #94a3b8; }
      .state-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 15px; fill: #ffffff; letter-spacing: 0.5px; }
      .state-desc { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #94a3b8; line-height: 1.5; }
      .pill-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: bold; font-size: 13px; }
      .card-border { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    </style>

    <!-- Drop Shadows -->
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
    <filter id="pill-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Fading Edge Mask -->
    <linearGradient id="edge-mask-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="widget-mask">
      <rect width="240" height="52" rx="8" fill="url(#edge-mask-grad)" />
    </mask>

    <!-- ==================== GRADIENTS FOR TEXT SHIMMER ==================== -->
    <!-- Calm pulsing blue shimmer for Lyssnar -->
    <linearGradient id="shimmer-lyssnar" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#94a3b8" />
      <animate attributeName="x1" values="-100%; 100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="3s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Active fast cyan/magenta shimmer for Transkriberar -->
    <linearGradient id="shimmer-transcrib" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#cbd5e1" />
      <animate attributeName="x1" values="-100%; 100%" dur="2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="2s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Magical warm gold shimmer for Polerar -->
    <linearGradient id="shimmer-polera" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#d97706" />
      <animate attributeName="x1" values="-100%; 100%" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="2.4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- ==================== GRADIENTS FOR WAVES ==================== -->
    <!-- Listening (Pure Neon Cyan, reactive) -->
    <linearGradient id="wave-listening" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Transcribing (Cyan and Purple/Magenta mixing) -->
    <linearGradient id="wave-transcribe-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#00a2ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="wave-transcribe-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Polishing (Warm Champagne and Gold Bloom) -->
    <radialGradient id="bloom-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep space background for canvas -->
  <rect width="100%" height="100%" fill="#0a0d16" />

  <!-- Canvas Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" class="title">RÖRELSEMÖNSTER I TRE STEG</text>
    <text x="0" y="20" class="subtitle">Hur den ikonlösa bakgrundsvågen ändrar karaktär genom dikteringscykeln</text>
    <rect x="0" y="-22" width="40" height="3" rx="1.5" fill="#f59e0b" />
  </g>

  <!-- ==================== STEP 1: LYSSNAR (ACTIVE MIC) ==================== -->
  <g transform="translate(40, 100)">
    <!-- Container Card -->
    <rect width="240" height="380" rx="12" fill="#0f1420" class="card-border" />
    <text x="20" y="30" class="state-title">STEG 1: LYSSNAR</text>
    <text x="20" y="275" class="state-title" font-size="12px" fill="#38bdf8">Röst-reaktiv våg</text>
    <text x="20" y="295" class="state-desc">Vågen rör sig organiskt upp och ner i realtid baserat på ljudvolymen från din röst. När du är tyst planar den ut till en fin, stilla linje.</text>

    <!-- Interactive Widget Simulator (Listening) -->
    <g transform="translate(0, 70)" filter="url(#pill-shadow)">
      <g mask="url(#widget-mask)">
        <rect width="240" height="52" rx="8" fill="rgba(11, 14, 23, 0.45)" />
        
        <!-- Reactive Voice Peak Wave (Tall peaks, simulated) -->
        <g opacity="0.95">
          <path fill="none" stroke="url(#wave-listening)" stroke-width="5" stroke-linecap="round">
            <!-- Morphing through different "spoken" volume states -->
            <animate attributeName="d" 
                     values="M -10,26 Q 30,-2 60,40 T 130,10 T 180,36 T 250,26;
                             M -10,26 Q 30,50 60,8 T 130,42 T 180,12 T 250,26;
                             M -10,26 Q 30,-2 60,40 T 130,10 T 180,36 T 250,26" 
                     dur="1.5s" repeatCount="indefinite"/>
          </path>
        </g>
        
        <rect width="240" height="52" rx="8" fill="rgba(10, 12, 20, 0.3)" pointer-events="none" />
        <rect width="240" height="52" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <path d="M 30,1 Q 120,1 210,1" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" fill="none" />
      </g>
      <!-- "Lyssnar..." with calm blue shimmer -->
      <text x="120" y="31" class="pill-text" fill="url(#shimmer-lyssnar)" text-anchor="middle" filter="url(#text-shadow)">Lyssnar...</text>
    </g>

    <!-- Specific Details list -->
    <g transform="translate(20, 150)" fill="#64748b" font-family="sans-serif" font-size="11px">
      <text x="0" y="0">• Färg: <tspan fill="#38bdf8" font-weight="bold">Isblå / Cyan</tspan></text>
      <text x="0" y="18">• Tempo: <tspan fill="#ffffff">Direkt, röststyrt</tspan></text>
      <text x="0" y="36">• Känsla: Mottaglig, levande</text>
    </g>
  </g>

  <!-- ==================== STEP 2: TRANSKRIBERAR (WHISPER WORKING) ==================== -->
  <g transform="translate(305, 100)">
    <!-- Container Card -->
    <rect width="240" height="380" rx="12" fill="#0f1420" class="card-border" />
    <text x="20" y="30" class="state-title">STEG 2: TRANSKRIBERAR</text>
    <text x="20" y="275" class="state-title" font-size="12px" fill="#a855f7">Löpande dubbelhelix</text>
    <text x="20" y="295" class="state-desc">Röst-reaktiviteten stängs av. Vågorna blir till ett rullande, asynkront flöde i två toner som löper snabbt från vänster till höger för att visa beräkningskraft.</text>

    <!-- Interactive Widget Simulator (Transcribing) -->
    <g transform="translate(0, 70)" filter="url(#pill-shadow)">
      <g mask="url(#widget-mask)">
        <rect width="240" height="52" rx="8" fill="rgba(11, 14, 23, 0.45)" />
        
        <!-- Fast rolling computing waves -->
        <g opacity="0.9" style="mix-blend-mode: screen;">
          <!-- Wave 1 (Cyan) -->
          <path fill="none" stroke="url(#wave-transcribe-cyan)" stroke-width="4" stroke-linecap="round">
            <animate attributeName="d" 
                     values="M -10,26 Q 25,12 60,26 T 130,26 T 180,26 T 220,26;
                             M -10,26 Q 25,40 60,26 T 130,26 T 180,26 T 220,26;
                             M -10,26 Q 25,12 60,26 T 130,26 T 180,26 T 220,26" 
                     dur="3.2s" repeatCount="indefinite"/>
          </path>
          <!-- Wave 2 (Magenta) -->
          <path fill="none" stroke="url(#wave-transcribe-magenta)" stroke-width="3" stroke-linecap="round">
            <animate attributeName="d" 
                     values="M -10,26 Q 30,34 75,26 T 145,26 T 180,26 T 220,26;
                             M -10,26 Q 30,18 75,26 T 145,26 T 180,26 T 220,26;
                             M -10,26 Q 30,34 75,26 T 145,26 T 180,26 T 220,26" 
                     dur="2.5s" repeatCount="indefinite"/>
          </path>
        </g>
        
        <rect width="240" height="52" rx="8" fill="rgba(10, 12, 20, 0.35)" pointer-events="none" />
        <rect width="240" height="52" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <path d="M 30,1 Q 120,1 210,1" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" fill="none" />
      </g>
      <!-- "Transkriberar..." with fast white shimmer -->
      <text x="120" y="31" class="pill-text" fill="url(#shimmer-transcrib)" text-anchor="middle" filter="url(#text-shadow)">Transkriberar...</text>
    </g>

    <!-- Specific Details list -->
    <g transform="translate(20, 150)" fill="#64748b" font-family="sans-serif" font-size="11px">
      <text x="0" y="0">• Färger: <tspan fill="#a855f7" font-weight="bold">Cyan &amp; Violett</tspan></text>
      <text x="0" y="18">• Tempo: <tspan fill="#ffffff">Snabbt, löpande rullande</tspan></text>
      <text x="0" y="36">• Känsla: Beräknande, tänkande</text>
    </g>
  </g>

  <!-- ==================== STEP 3: POLERAR (LLM REFINING / FINISHING) ==================== -->
  <g transform="translate(570, 100)">
    <!-- Container Card -->
    <rect width="240" height="380" rx="12" fill="#0f1420" class="card-border" />
    <text x="20" y="30" class="state-title">STEG 3: POLERAR / GRANSKAR</text>
    <text x="20" y="275" class="state-title" font-size="12px" fill="#f59e0b">Andande guld-bloom</text>
    <text x="20" y="295" class="state-desc">Alla vilda linjer slätas ut och försvinner. Kvar blir en rofylld, glödande champagne-guldglöd (bloom) i mitten av widgeten som expanderar och andas i ett lugnt tempo.</text>

    <!-- Interactive Widget Simulator (Polishing) -->
    <g transform="translate(0, 70)" filter="url(#pill-shadow)">
      <g mask="url(#widget-mask)">
        <rect width="240" height="52" rx="8" fill="rgba(11, 14, 23, 0.45)" />
        
        <!-- Breathing Gold Glow in the center -->
        <circle cx="120" cy="26" r="35" fill="url(#bloom-gold)">
          <animate attributeName="r" values="35; 55; 35" dur="3s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite" />
        </circle>
        
        <rect width="240" height="52" rx="8" fill="rgba(10, 12, 20, 0.2)" pointer-events="none" />
        <rect width="240" height="52" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <path d="M 30,1 Q 120,1 210,1" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" fill="none" />
      </g>
      <!-- "Polerar text..." with gold shimmer -->
      <text x="120" y="31" class="pill-text" fill="url(#shimmer-polera)" text-anchor="middle" filter="url(#text-shadow)">Polerar text...</text>
    </g>

    <!-- Specific Details list -->
    <g transform="translate(20, 150)" fill="#64748b" font-family="sans-serif" font-size="11px">
      <text x="0" y="0">• Färger: <tspan fill="#f59e0b" font-weight="bold">Varmguld &amp; Champagne</tspan></text>
      <text x="0" y="18">• Tempo: <tspan fill="#ffffff">Långsamt, andande</tspan></text>
      <text x="0" y="36">• Känsla: Magisk, förädlande, klar</text>
    </g>
  </g>

</svg>
