<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="siri-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="siri-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="siri-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Windows 11 Card Representation (rx="8" instead of rx="30") -->
  <rect width="100" height="100" rx="8" fill="#10141c" stroke="rgba(255,255,255,0.11)" stroke-width="1.5"/>

  <!-- Centered Inner Mask area to contain waves -->
  <g transform="translate(15, 25)">
    <!-- Cyan Wave (Bottom Layer) -->
    <path fill="none" stroke="url(#siri-cyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <animate attributeName="d" 
               values="M 0,25 Q 17.5,5 35,25 T 70,25;
                       M 0,25 Q 17.5,45 35,25 T 70,25;
                       M 0,25 Q 17.5,5 35,25 T 70,25" 
               dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Magenta Wave (Middle Layer) -->
    <path fill="none" stroke="url(#siri-magenta)" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <animate attributeName="d" 
               values="M 0,25 Q 17.5,40 35,25 T 70,25;
                       M 0,25 Q 17.5,10 35,25 T 70,25;
                       M 0,25 Q 17.5,40 35,25 T 70,25" 
               dur="2.4s" repeatCount="indefinite"/>
    </path>

    <!-- Yellow/Orange Wave (Top Layer) -->
    <path fill="none" stroke="url(#siri-yellow)" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
      <animate attributeName="d" 
               values="M 0,25 Q 17.5,15 35,25 T 70,25;
                       M 0,25 Q 17.5,35 35,25 T 70,25;
                       M 0,25 Q 17.5,15 35,25 T 70,25" 
               dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- Central High-frequency highlight wave -->
    <path fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6">
      <animate attributeName="d" 
               values="M 5,25 Q 22.5,20 40,25 T 65,25;
                       M 5,25 Q 22.5,30 40,25 T 65,25;
                       M 5,25 Q 22.5,20 40,25 T 65,25" 
               dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Mic Icon Overlay (Subtle and offset slightly to frame the wave) -->
  <g fill="#ffffff" transform="translate(36, 35)" opacity="0.25">
    <rect x="10" y="5" width="8" height="13" rx="4" />
    <path d="M5,12 A7,7 0 0,0 23,12" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <line x1="14" y1="20" x2="14" y2="24" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
