<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <radialGradient id="pulse-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Windows 11 Card Representation (rx="8" instead of rx="30") -->
  <rect width="100" height="100" rx="8" fill="#10141c" stroke="rgba(255,255,255,0.11)" stroke-width="1.5"/>

  <!-- Pulse 1 (Expanding & Fading) -->
  <circle cx="50" cy="50" r="10" fill="none" stroke="#38bdf8" stroke-width="2">
    <animate attributeName="r" values="10; 38" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9; 0" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Pulse 2 (Staggered offset) -->
  <circle cx="50" cy="50" r="10" fill="none" stroke="#6366f1" stroke-width="1.5">
    <animate attributeName="r" values="10; 38" dur="2.5s" begin="0.83s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9; 0" dur="2.5s" begin="0.83s" repeatCount="indefinite" />
  </circle>

  <!-- Pulse 3 (Staggered offset 2) -->
  <circle cx="50" cy="50" r="10" fill="none" stroke="#a5b4fc" stroke-width="1">
    <animate attributeName="r" values="10; 38" dur="2.5s" begin="1.66s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8; 0" dur="2.5s" begin="1.66s" repeatCount="indefinite" />
  </circle>

  <!-- Central Constant Soft Glow -->
  <circle cx="50" cy="50" r="12" fill="#38bdf8" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Mic Icon Overlay (Centered, sharp) -->
  <g fill="#ffffff" transform="translate(36, 35)">
    <!-- Mic Body -->
    <rect x="10" y="5" width="8" height="13" rx="4" fill="#ffffff" />
    <!-- Mic Stand -->
    <path d="M5,12 A7,7 0 0,0 23,12" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <line x1="14" y1="20" x2="14" y2="24" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="9" y1="24" x2="19" y2="24" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
