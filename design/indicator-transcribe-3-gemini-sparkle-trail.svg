<svg width="820" height="260" viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pillShadow" x="-20%" y="-80%" width="140%" height="260%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".30"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f2efe8"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.5" stop-color="#FECC02"/>
      <stop offset="1" stop-color="#7aa6ff"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="textMask">
      <rect width="100%" height="100%" fill="black"/>
      <text x="78" y="34" font-family="Segoe UI, Arial" font-weight="700" font-size="16" fill="white">Transkriberar</text>
    </mask>

    <!-- 4-point sparkle path (Gemini-style) centered at 0,0, radius ~10 -->
    <path id="sparkle" d="M 0,-10 C 1.5,-3 3,-1.5 10,0 C 3,1.5 1.5,3 0,10 C -1.5,3 -3,1.5 -10,0 C -3,-1.5 -1.5,-3 0,-10 Z"/>

    <style>
      .title{fill:#111827;font:700 24px 'Segoe UI',Arial}
      .desc{fill:#5f6878;font:400 14px 'Segoe UI',Arial}
      .label{fill:#e6ecf2;font:700 16px 'Segoe UI',Arial}
    </style>
  </defs>

  <rect fill="url(#bg)" width="820" height="260"/>
  <text x="34" y="46" class="title">3. Gemini Sparkle Trail</text>
  <text x="34" y="74" class="desc">4-uddig stjärna morphar storlek · mini-sparkles driver bakåt · ikon kvar · inspiration: Google Gemini</text>

  <g transform="translate(34 130)">
    <rect width="232" height="56" rx="19" fill="url(#pillFill)" filter="url(#pillShadow)"/>
    <rect x="14" y="1" width="204" height="1" fill="#ffffff" fill-opacity="0.18"/>

    <!-- Project icon (left of sparkle area) -->
    <g transform="translate(28 28)">
      <circle r="11" fill="#006AA7"/>
      <rect x="-2.8" y="-7" width="5.6" height="9.5" rx="2.8" fill="#FECC02"/>
      <path d="M -5 1 Q 0 6 5 1" fill="none" stroke="#FECC02" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Trailing mini sparkles flowing right -> left into main sparkle -->
    <g fill="#FECC02" opacity="0.85">
      <use href="#sparkle" transform="translate(65 28) scale(0.18)">
        <animate attributeName="opacity" values="0;0.9;0" dur="1.6s" begin="0s"   repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="68,32; 55,28; 50,26" dur="1.6s" begin="0s" repeatCount="indefinite" additive="sum"/>
      </use>
      <use href="#sparkle" transform="translate(72 22) scale(0.14)" fill="#7aa6ff">
        <animate attributeName="opacity" values="0;0.8;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </use>
      <use href="#sparkle" transform="translate(60 36) scale(0.16)">
        <animate attributeName="opacity" values="0;0.8;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- Main morphing sparkle -->
    <g transform="translate(54 28)">
      <use href="#sparkle" fill="url(#sparkleGrad)">
        <animateTransform attributeName="transform" type="scale" values="0.85;1.15;0.85" dur="1.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="45" dur="3.2s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>

    <!-- Label -->
    <text x="78" y="34" class="label">Transkriberar</text>

    <g mask="url(#textMask)">
      <rect x="-120" y="0" width="120" height="56" fill="url(#shimmer)">
        <animate attributeName="x" from="-120" to="232" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
