<svg width="900" height="780" viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pillShadow" x="-20%" y="-80%" width="140%" height="260%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".30"/>
    </filter>
    <filter id="orbBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f2efe8"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>

    <!-- 1: aurora -->
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FECC02" stop-opacity="0"/>
      <stop offset="0.30" stop-color="#FECC02" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#7aa6ff" stop-opacity="0.85"/>
      <stop offset="0.80" stop-color="#006AA7" stop-opacity="0.95"/>
      <stop offset="1"    stop-color="#006AA7" stop-opacity="0"/>
    </linearGradient>
    <mask id="ringMaskA">
      <rect width="100%" height="100%" fill="black"/>
      <circle cx="40" cy="28" r="20" fill="white"/>
      <circle cx="40" cy="28" r="15" fill="black"/>
    </mask>

    <!-- 2: orb -->
    <radialGradient id="orbCore" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0"    stop-color="#fff7c2"/>
      <stop offset="0.35" stop-color="#FECC02"/>
      <stop offset="0.75" stop-color="#3b8fd6"/>
      <stop offset="1"    stop-color="#006AA7"/>
    </radialGradient>
    <radialGradient id="orbHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FECC02" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3b8fd6" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#006AA7" stop-opacity="0"/>
    </radialGradient>

    <!-- 3: sparkle -->
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.5" stop-color="#FECC02"/>
      <stop offset="1" stop-color="#7aa6ff"/>
    </linearGradient>
    <path id="sparkle" d="M 0,-10 C 1.5,-3 3,-1.5 10,0 C 3,1.5 1.5,3 0,10 C -1.5,3 -3,1.5 -10,0 C -3,-1.5 -1.5,-3 0,-10 Z"/>

    <!-- 5: ribbon -->
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#006AA7"/>
      <stop offset="0.5" stop-color="#7aa6ff"/>
      <stop offset="1"   stop-color="#FECC02"/>
    </linearGradient>
    <clipPath id="ribbonClip">
      <rect x="14" y="14" width="52" height="28" rx="14"/>
    </clipPath>

    <!-- shared shimmer -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="textMask">
      <rect width="100%" height="100%" fill="black"/>
      <text x="78" y="34" font-family="Segoe UI, Arial" font-weight="700" font-size="16" fill="white">Transkriberar</text>
    </mask>

    <style>
      .h{fill:#111827;font:700 28px 'Segoe UI',Arial}
      .sub{fill:#5f6878;font:400 14px 'Segoe UI',Arial}
      .name{fill:#111827;font:700 18px 'Segoe UI',Arial}
      .desc{fill:#5f6878;font:400 13px 'Segoe UI',Arial}
      .label{fill:#e6ecf2;font:700 16px 'Segoe UI',Arial}
      .edge{stroke-width:0.9;fill:none;stroke-linecap:round;opacity:0.55}
      .node{fill:#7aa6ff}
    </style>
  </defs>

  <rect fill="url(#bg)" width="900" height="780"/>

  <!-- Header -->
  <text x="40" y="50" class="h">Transkriberings-animering · 5 förslag</text>
  <text x="40" y="76" class="sub">Modern AI-känsla i svenska flagg-färger · pill 232×56px · text-shimmer på alla · öppna i webbläsare för att se animationen</text>

  <!-- ============================================================ -->
  <!-- 1. AURORA FLOW -->
  <!-- ============================================================ -->
  <g transform="translate(40 120)">
    <text x="0" y="-12" class="name">1. Aurora Flow</text>
    <text x="140" y="-12" class="desc">Konisk gradient sveper runt ikonkanten · ikon kvar · Apple Intelligence-vibe</text>

    <rect width="232" height="56" rx="19" fill="url(#pillFill)" filter="url(#pillShadow)"/>
    <rect x="14" y="1" width="204" height="1" fill="#ffffff" fill-opacity="0.18"/>
    <g mask="url(#ringMaskA)">
      <g transform="translate(40 28)">
        <rect x="-40" y="-40" width="80" height="80" fill="url(#auroraGrad)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <circle cx="40" cy="28" r="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="40" cy="28" r="13" fill="#006AA7"/>
    <rect x="36.8" y="20.5" width="6.4" height="11" rx="3.2" fill="#FECC02"/>
    <path d="M33.5 28 Q40 35 46.5 28" fill="none" stroke="#FECC02" stroke-width="1.8" stroke-linecap="round"/>
    <text x="78" y="34" class="label">Transkriberar</text>
    <g mask="url(#textMask)">
      <rect x="-120" y="0" width="120" height="56" fill="url(#shimmer)">
        <animate attributeName="x" from="-120" to="232" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 2. SIRI ORB BLOOM -->
  <!-- ============================================================ -->
  <g transform="translate(40 240)">
    <text x="0" y="-12" class="name">2. Siri Orb Bloom</text>
    <text x="172" y="-12" class="desc">Pulserande gradient-orb · motroterande halvringar · halo-blur · Siri-vibe</text>

    <rect width="232" height="56" rx="19" fill="url(#pillFill)" filter="url(#pillShadow)"/>
    <rect x="14" y="1" width="204" height="1" fill="#ffffff" fill-opacity="0.18"/>

    <circle cx="40" cy="28" r="22" fill="url(#orbHalo)" filter="url(#orbBlur)">
      <animate attributeName="r" values="18;24;18" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(40 28)">
      <g>
        <path d="M -16 0 A 16 16 0 0 1 16 0" fill="none" stroke="#FECC02" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="M -13 0 A 13 13 0 0 1 13 0" fill="none" stroke="#7aa6ff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2.8s" repeatCount="indefinite"/>
      </g>
    </g>
    <circle cx="40" cy="28" r="10" fill="url(#orbCore)">
      <animate attributeName="r" values="8.5;11.5;8.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="37" cy="25" rx="3" ry="2" fill="#ffffff" opacity="0.55"/>

    <text x="78" y="34" class="label">Transkriberar</text>
    <g mask="url(#textMask)">
      <rect x="-120" y="0" width="120" height="56" fill="url(#shimmer)">
        <animate attributeName="x" from="-120" to="232" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 3. GEMINI SPARKLE TRAIL -->
  <!-- ============================================================ -->
  <g transform="translate(40 360)">
    <text x="0" y="-12" class="name">3. Gemini Sparkle Trail</text>
    <text x="220" y="-12" class="desc">4-uddig stjärna morphar · partikelsvans · ikon kvar · Gemini-vibe</text>

    <rect width="232" height="56" rx="19" fill="url(#pillFill)" filter="url(#pillShadow)"/>
    <rect x="14" y="1" width="204" height="1" fill="#ffffff" fill-opacity="0.18"/>

    <g transform="translate(28 28)">
      <circle r="11" fill="#006AA7"/>
      <rect x="-2.8" y="-7" width="5.6" height="9.5" rx="2.8" fill="#FECC02"/>
      <path d="M -5 1 Q 0 6 5 1" fill="none" stroke="#FECC02" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g fill="#FECC02" opacity="0.85">
      <use href="#sparkle" transform="translate(68 32) scale(0.18)">
        <animate attributeName="opacity" values="0;0.9;0" dur="1.6s" begin="0s"   repeatCount="indefinite"/>
      </use>
      <use href="#sparkle" transform="translate(72 22) scale(0.14)" fill="#7aa6ff">
        <animate attributeName="opacity" values="0;0.8;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </use>
      <use href="#sparkle" transform="translate(60 36) scale(0.16)">
        <animate attributeName="opacity" values="0;0.8;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(54 28)">
      <use href="#sparkle" fill="url(#sparkleGrad)">
        <animateTransform attributeName="transform" type="scale" values="0.85;1.15;0.85" dur="1.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="45" dur="3.2s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>

    <text x="78" y="34" class="label">Transkriberar</text>
    <g mask="url(#textMask)">
      <rect x="-120" y="0" width="120" height="56" fill="url(#shimmer)">
        <animate attributeName="x" from="-120" to="232" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 4. NEURAL MESH -->
  <!-- ============================================================ -->
  <g transform="translate(40 480)">
    <text x="0" y="-12" class="name">4. Neural Mesh</text>
    <text x="156" y="-12" class="desc">6 noder + central puls · linjer tänds i sekvens · ChatGPT thinking-vibe</text>

    <rect width="232" height="56" rx="19" fill="url(#pillFill)" filter="url(#pillShadow)"/>
    <rect x="14" y="1" width="204" height="1" fill="#ffffff" fill-opacity="0.18"/>

    <g transform="translate(40 28)">
      <g>
        <line class="edge" stroke="#2d3a49" x1="0" y1="0" x2="14"   y2="0">
          <animate attributeName="stroke" values="#2d3a49;#FECC02;#2d3a49" dur="2s" begin="0s"    repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;1;0.35"            dur="2s" begin="0s"    repeatCount="indefinite"/>
        </line>
        <line class="edge" stroke="#2d3a49" x1="0" y1="0" x2="7"    y2="-12.12">
          <animate attributeName="stroke" values="#2d3a49;#FECC02;#2d3a49" dur="2s" begin="0.33s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;1;0.35"            dur="2s" begin="0.33s" repeatCount="indefinite"/>
        </line>
        <line class="edge" stroke="#2d3a49" x1="0" y1="0" x2="-7"   y2="-12.12">
          <animate attributeName="stroke" values="#2d3a49;#FECC02;#2d3a49" dur="2s" begin="0.66s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;1;0.35"            dur="2s" begin="0.66s" repeatCount="indefinite"/>
        </line>
        <line class="edge" stroke="#2d3a49" x1="0" y1="0" x2="-14"  y2="0">
          <animate attributeName="stroke" values="#2d3a49;#FECC02;#2d3a49" dur="2s" begin="1.0s"  repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;1;0.35"            dur="2s" begin="1.0s"  repeatCount="indefinite"/>
        </line>
        <line class="edge" stroke="#2d3a49" x1="0" y1="0" x2="-7"   y2="12.12">
          <animate attributeName="stroke" values="#2d3a49;#FECC02;#2d3a49" dur="2s" begin="1.33s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;1;0.35"            dur="2s" begin="1.33s" repeatCount="indefinite"/>
        </line>
        <line class="edge" stroke="#2d3a49" x1="0" y1="0" x2="7"    y2="12.12">
          <animate attributeName="stroke" values="#2d3a49;#FECC02;#2d3a49" dur="2s" begin="1.66s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;1;0.35"            dur="2s" begin="1.66s" repeatCount="indefinite"/>
        </line>
      </g>
      <g opacity="0.30">
        <line class="edge" stroke="#7aa6ff" x1="14"  y1="0"      x2="7"   y2="-12.12"/>
        <line class="edge" stroke="#7aa6ff" x1="7"   y1="-12.12" x2="-7"  y2="-12.12"/>
        <line class="edge" stroke="#7aa6ff" x1="-7"  y1="-12.12" x2="-14" y2="0"/>
        <line class="edge" stroke="#7aa6ff" x1="-14" y1="0"      x2="-7"  y2="12.12"/>
        <line class="edge" stroke="#7aa6ff" x1="-7"  y1="12.12"  x2="7"   y2="12.12"/>
        <line class="edge" stroke="#7aa6ff" x1="7"   y1="12.12"  x2="14"  y2="0"/>
      </g>
      <circle class="node" cx="14"   cy="0"      r="2"/>
      <circle class="node" cx="7"    cy="-12.12" r="2"/>
      <circle class="node" cx="-7"   cy="-12.12" r="2"/>
      <circle class="node" cx="-14"  cy="0"      r="2"/>
      <circle class="node" cx="-7"   cy="12.12"  r="2"/>
      <circle class="node" cx="7"    cy="12.12"  r="2"/>
      <circle cx="0" cy="0" r="3.6" fill="#FECC02">
        <animate attributeName="r" values="3;4.6;3" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="3.6" fill="none" stroke="#FECC02" stroke-opacity="0.7">
        <animate attributeName="r"              values="3;14;14" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0;0"  dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="78" y="34" class="label">Transkriberar</text>
    <g mask="url(#textMask)">
      <rect x="-120" y="0" width="120" height="56" fill="url(#shimmer)">
        <animate attributeName="x" from="-120" to="232" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 5. WAVEFORM RIBBON -->
  <!-- ============================================================ -->
  <g transform="translate(40 600)">
    <text x="0" y="-12" class="name">5. Waveform Ribbon</text>
    <text x="184" y="-12" class="desc">Trelagrad gradient-sinusvåg under ikonen · olika fas + opacity · ElevenLabs-vibe</text>

    <rect width="232" height="56" rx="19" fill="url(#pillFill)" filter="url(#pillShadow)"/>
    <rect x="14" y="1" width="204" height="1" fill="#ffffff" fill-opacity="0.18"/>

    <g transform="translate(40 24)">
      <circle r="11" fill="#006AA7"/>
      <rect x="-2.8" y="-7" width="5.6" height="9.5" rx="2.8" fill="#FECC02"/>
      <path d="M -5 1 Q 0 6 5 1" fill="none" stroke="#FECC02" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g clip-path="url(#ribbonClip)" fill="none" stroke-linecap="round">
      <g opacity="0.35">
        <path d="M -40 38 Q -30 32, -20 38 T 0 38 T 20 38 T 40 38 T 60 38 T 80 38 T 100 38 T 120 38"
              stroke="url(#ribbonGrad)" stroke-width="2">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="1.8s" repeatCount="indefinite"/>
        </path>
      </g>
      <g opacity="0.65">
        <path d="M -40 40 Q -30 34, -20 40 T 0 40 T 20 40 T 40 40 T 60 40 T 80 40 T 100 40 T 120 40"
              stroke="url(#ribbonGrad)" stroke-width="2.2">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="1.4s" repeatCount="indefinite"/>
        </path>
      </g>
      <g opacity="1">
        <path d="M -40 42 Q -30 35, -20 42 T 0 42 T 20 42 T 40 42 T 60 42 T 80 42 T 100 42 T 120 42"
              stroke="url(#ribbonGrad)" stroke-width="2.4">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="1.1s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <text x="78" y="34" class="label">Transkriberar</text>
    <g mask="url(#textMask)">
      <rect x="-120" y="0" width="120" height="56" fill="url(#shimmer)">
        <animate attributeName="x" from="-120" to="232" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- footer -->
  <text x="40" y="730" class="sub">Tips: dra-och-släpp denna fil i Chrome/Edge för att se alla 5 animera samtidigt. Loop-tider: 1.1s – 2.8s · text-shimmer 2.2s.</text>
</svg>
