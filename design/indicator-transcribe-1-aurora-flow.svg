<svg width="820" height="260" viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pillShadow" x="-20%" y="-80%" width="140%" height="260%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".30"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f2efe8"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>

    <!-- Aurora conic-like gradient simulated with linearGradient that rotates -->
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FECC02" stop-opacity="0"/>
      <stop offset="0.30" stop-color="#FECC02" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#7aa6ff" stop-opacity="0.85"/>
      <stop offset="0.80" stop-color="#006AA7" stop-opacity="0.95"/>
      <stop offset="1"    stop-color="#006AA7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Clip the aurora ring inside a thin band -->
    <mask id="ringMask">
      <rect width="100%" height="100%" fill="black"/>
      <circle cx="40" cy="28" r="20" fill="white"/>
      <circle cx="40" cy="28" r="15" fill="black"/>
    </mask>

    <!-- Text mask so shimmer only shows over the label -->
    <mask id="textMask">
      <rect width="100%" height="100%" fill="black"/>
      <text x="78" y="34" font-family="Segoe UI, Arial" font-weight="700" font-size="16" fill="white">Transkriberar</text>
    </mask>

    <style>
      .title{fill:#111827;font:700 24px 'Segoe UI',Arial}
      .desc{fill:#5f6878;font:400 14px 'Segoe UI',Arial}
      .label{fill:#e6ecf2;font:700 16px 'Segoe UI',Arial}
    </style>
  </defs>

  <rect fill="url(#bg)" width="820" height="260"/>
  <text x="34" y="46" class="title">1. Aurora Flow</text>
  <text x="34" y="74" class="desc">Konisk aurora-gradient sveper runt ikonkanten · ikonen kvar · text-shimmer · inspiration: Apple Intelligence</text>

  <!-- The pill -->
  <g transform="translate(34 130)">
    <rect class="p" width="232" height="56" rx="19" fill="url(#pillFill)" filter="url(#pillShadow)"/>
    <rect x="14" y="1" width="204" height="1" fill="#ffffff" fill-opacity="0.18"/>

    <!-- Aurora ring around icon -->
    <g mask="url(#ringMask)">
      <g transform="translate(40 28)">
        <rect x="-40" y="-40" width="80" height="80" fill="url(#auroraGrad)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Faint base ring under aurora for definition -->
    <circle cx="40" cy="28" r="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

    <!-- Project icon (mic, simplified Swedish flag tones) -->
    <circle cx="40" cy="28" r="13" fill="#006AA7"/>
    <rect x="36.8" y="20.5" width="6.4" height="11" rx="3.2" fill="#FECC02"/>
    <path d="M33.5 28 Q40 35 46.5 28" fill="none" stroke="#FECC02" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="40" y1="32" x2="40" y2="35" stroke="#FECC02" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Label -->
    <text x="78" y="34" class="label">Transkriberar</text>

    <!-- Text shimmer overlay -->
    <g mask="url(#textMask)">
      <rect x="-120" y="0" width="120" height="56" fill="url(#shimmer)">
        <animate attributeName="x" from="-120" to="232" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
