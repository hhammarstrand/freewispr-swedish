<svg width="820" height="260" viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pillShadow" x="-20%" y="-80%" width="140%" height="260%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".30"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f2efe8"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#006AA7"/>
      <stop offset="0.5" stop-color="#7aa6ff"/>
      <stop offset="1"   stop-color="#FECC02"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="textMask">
      <rect width="100%" height="100%" fill="black"/>
      <text x="78" y="34" font-family="Segoe UI, Arial" font-weight="700" font-size="16" fill="white">Transkriberar</text>
    </mask>

    <!-- Clip ribbon to a band so it doesn't spill outside icon area -->
    <clipPath id="ribbonClip">
      <rect x="14" y="14" width="52" height="28" rx="14"/>
    </clipPath>

    <style>
      .title{fill:#111827;font:700 24px 'Segoe UI',Arial}
      .desc{fill:#5f6878;font:400 14px 'Segoe UI',Arial}
      .label{fill:#e6ecf2;font:700 16px 'Segoe UI',Arial}
    </style>
  </defs>

  <rect fill="url(#bg)" width="820" height="260"/>
  <text x="34" y="46" class="title">5. Waveform Ribbon</text>
  <text x="34" y="74" class="desc">Trelagrad gradient-sinusvåg under ikonen · faslager med olika opacity · inspiration: ElevenLabs / voice-AI</text>

  <g transform="translate(34 130)">
    <rect width="232" height="56" rx="19" fill="url(#pillFill)" filter="url(#pillShadow)"/>
    <rect x="14" y="1" width="204" height="1" fill="#ffffff" fill-opacity="0.18"/>

    <!-- Icon (top-shifted slightly to make room for ribbon below) -->
    <g transform="translate(40 24)">
      <circle r="11" fill="#006AA7"/>
      <rect x="-2.8" y="-7" width="5.6" height="9.5" rx="2.8" fill="#FECC02"/>
      <path d="M -5 1 Q 0 6 5 1" fill="none" stroke="#FECC02" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Ribbons: three sine paths that translate left, gradient stroke, clipped to band -->
    <g clip-path="url(#ribbonClip)" fill="none" stroke-linecap="round">
      <!-- back layer -->
      <g opacity="0.35">
        <path d="M -40 38 Q -30 32, -20 38 T 0 38 T 20 38 T 40 38 T 60 38 T 80 38 T 100 38 T 120 38"
              stroke="url(#ribbonGrad)" stroke-width="2">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="1.8s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- mid layer -->
      <g opacity="0.65">
        <path d="M -40 40 Q -30 34, -20 40 T 0 40 T 20 40 T 40 40 T 60 40 T 80 40 T 100 40 T 120 40"
              stroke="url(#ribbonGrad)" stroke-width="2.2">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="1.4s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- front layer -->
      <g opacity="1">
        <path d="M -40 42 Q -30 35, -20 42 T 0 42 T 20 42 T 40 42 T 60 42 T 80 42 T 100 42 T 120 42"
              stroke="url(#ribbonGrad)" stroke-width="2.4">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="1.1s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- Label -->
    <text x="78" y="34" class="label">Transkriberar</text>

    <g mask="url(#textMask)">
      <rect x="-120" y="0" width="120" height="56" fill="url(#shimmer)">
        <animate attributeName="x" from="-120" to="232" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
