      .row-note { fill: #d0d5dd; font: 500 12px 'Segoe UI', Arial, sans-serif; }
      .state-label { fill: #f8fafc; font: 760 15px 'Segoe UI', Arial, sans-serif; letter-spacing: -0.02em; }
      .state-label-dark { fill: #111827; font: 760 15px 'Segoe UI', Arial, sans-serif; letter-spacing: -0.02em; }
      .mini { fill: #d0d5dd; font: 650 11px 'Cascadia Mono', Consolas, monospace; letter-spacing: 0.08em; }
      .title-chip { fill: #111827; fill-opacity: 0.84; stroke: url(#edgeStroke); stroke-width: 1; filter: url(#pillShadow); }
      .pill-dark { fill: url(#glassDark); stroke: url(#edgeStroke); stroke-width: 1; filter: url(#pillShadow); }
      .pill-light { fill: url(#glassLight); stroke: rgba(17,24,39,0.14); stroke-width: 1; filter: url(#pillShadow); }
      .round { stroke-linecap: round; stroke-linejoin: round; }
