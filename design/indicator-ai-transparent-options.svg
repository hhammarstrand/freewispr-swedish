<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pillShadow" x="-20%" y="-80%" width="140%" height="260%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="softAura" x="-80%" y="-120%" width="260%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glassDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18202c" stop-opacity="0.94"/>
      <stop offset="0.55" stop-color="#111827" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0a0e15" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="glassLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f2efe8" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="aiBlueGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#006AA7"/>
      <stop offset="0.48" stop-color="#37a6d8"/>
      <stop offset="1" stop-color="#FECC02"/>
    </linearGradient>
    <linearGradient id="aiGoldBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FECC02"/>
      <stop offset="0.55" stop-color="#7F9B55"/>
      <stop offset="1" stop-color="#006AA7"/>
    </linearGradient>
    <linearGradient id="edgeStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#006AA7" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FECC02" stop-opacity="0.40"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#FECC02" stop-opacity="0.52"/>
      <stop offset="0.45" stop-color="#006AA7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#006AA7" stop-opacity="0"/>
