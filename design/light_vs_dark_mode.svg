<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <!-- Common definitions, filters, and fonts -->
  <defs>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 22px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 400; font-size: 13px; fill: #94a3b8; }
      .section-header { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #f8fafc; }
      .preview-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #64748b; }
      .pill-text-dark { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: bold; font-size: 13px; fill: url(#shimmer-dark); }
      .pill-text-light { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: bold; font-size: 13px; fill: url(#shimmer-light); }
      .badge-dark { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #38bdf8; }
      .badge-light { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #0284c7; }
    </style>

    <!-- Text shadows for readability -->
    <filter id="shadow-dark-text" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="shadow-light-text" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>
    <filter id="pill-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Fading Edge Mask for both modes -->
    <linearGradient id="edge-mask-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="widget-mask">
      <rect x="0" y="0" width="240" height="52" rx="8" fill="url(#edge-mask-grad)" />
    </mask>

    <!-- Shimmer for Dark Mode (White/Platinum highlight) -->
    <linearGradient id="shimmer-dark" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#cbd5e1" />
      <animate attributeName="x1" values="-100%; 100%" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="2.4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Shimmer for Light Mode (Dark Charcoal/Silver highlight) -->
    <linearGradient id="shimmer-light" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="35%" stop-color="#374151" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="65%" stop-color="#374151" />
      <stop offset="100%" stop-color="#374151" />
      <animate attributeName="x1" values="-100%; 100%" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="2.4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- WAVES FOR DARK MODE (Bright glowing neon) -->
    <linearGradient id="dark-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="dark-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.05"/>
    </linearGradient>

    <!-- WAVES FOR LIGHT MODE (More saturated for high contrast) -->
    <linearGradient id="light-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="light-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Deep space background for canvas -->
  <rect width="100%" height="100%" fill="#0a0d16" />

  <!-- Canvas Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" class="title">LIGHT &amp; DARK MODE ANPASSNING</text>
    <text x="0" y="20" class="subtitle">Hur det nya ikonlösa förslaget anpassas för att smälta in optimalt i Windows 11</text>
    <rect x="0" y="-22" width="40" height="3" rx="1.5" fill="#38bdf8" />
  </g>

  <!-- ==================== LEFT HALF: DARK MODE PREVIEW ==================== -->
  <g transform="translate(40, 100)">
    <!-- Dark Mode OS Simulator Window Background -->
    <rect width="360" height="340" rx="12" fill="#18181c" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <!-- Simulator Content Mockup (simulated dark code editor/explorer) -->
    <rect x="15" y="15" width="330" height="60" rx="6" fill="#1e1e24" />
    <circle cx="35" cy="45" r="10" fill="#38bdf8" opacity="0.2" />
    <rect x="55" y="38" width="120" height="6" rx="3" fill="#3f3f46" />
    <rect x="55" y="48" width="80" height="5" rx="2.5" fill="#27272a" />
    
    <text x="20" y="110" class="section-header">WINDOWS 11 DARK THEME</text>
    <text x="20" y="128" class="preview-label">Widgeten smälter sömlöst ihop med mörka fönster</text>

    <!-- Simulated Widget Floating Over Dark Content -->
    <g transform="translate(60, 170)" filter="url(#pill-shadow)">
      <g mask="url(#widget-mask)">
        <!-- Dark Translucent Base Plate -->
        <rect width="240" height="52" rx="8" fill="rgba(15, 18, 28, 0.45)" />
        
        <!-- Live Neon Waves -->
        <g opacity="0.95" style="mix-blend-mode: screen;">
          <path fill="none" stroke="url(#dark-cyan)" stroke-width="6" stroke-linecap="round">
            <animate attributeName="d" 
                     values="M -10,26 Q 30,6 70,26 T 150,26 T 210,26 T 250,26;
                             M -10,26 Q 30,46 70,26 T 150,26 T 210,26 T 250,26;
                             M -10,26 Q 30,6 70,26 T 150,26 T 210,26 T 250,26" 
                     dur="5s" repeatCount="indefinite"/>
          </path>
          <path fill="none" stroke="url(#dark-magenta)" stroke-width="4" stroke-linecap="round">
            <animate attributeName="d" 
                     values="M -10,26 Q 40,41 90,26 T 170,26 T 210,26 T 250,26;
                             M -10,26 Q 40,11 90,26 T 170,26 T 210,26 T 250,26;
                             M -10,26 Q 40,41 90,26 T 170,26 T 210,26 T 250,26" 
                     dur="4s" repeatCount="indefinite"/>
          </path>
        </g>
        
        <!-- Inner Overlay and borders -->
        <rect width="240" height="52" rx="8" fill="rgba(10, 12, 20, 0.35)" pointer-events="none" />
        <rect width="240" height="52" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <path d="M 30,1 Q 120,1 210,1" stroke="rgba(255,255,255,0.18)" stroke-width="0.8" fill="none" />
      </g>
      <!-- Center Shimmering White Text -->
      <text x="120" y="31" class="pill-text-dark" text-anchor="middle" filter="url(#shadow-dark-text)">Transkriberar...</text>
    </g>

    <!-- Specs annotation -->
    <rect x="20" y="270" width="320" height="50" rx="6" fill="#1e1e24" />
    <text x="35" y="290" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#94a3b8">
      • Bakgrund: <tspan fill="#38bdf8" font-weight="bold">rgba(15, 18, 28, 0.45)</tspan> (Mörk Akryl)
    </text>
    <text x="35" y="306" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#94a3b8">
      • Text: <tspan fill="#ffffff" font-weight="bold">Vitt Shimmer</tspan> | Ramen fadas ut mot sidorna
    </text>
  </g>

  <!-- ==================== RIGHT HALF: LIGHT MODE PREVIEW ==================== -->
  <g transform="translate(450, 100)">
    <!-- Light Mode OS Simulator Window Background -->
    <rect width="360" height="340" rx="12" fill="#f3f4f6" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
    <!-- Simulator Content Mockup (simulated light web page/file explorer) -->
    <rect x="15" y="15" width="330" height="60" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.04)" stroke-width="1" />
    <circle cx="35" cy="45" r="10" fill="#0284c7" opacity="0.15" />
    <rect x="55" y="38" width="120" height="6" rx="3" fill="#e5e7eb" />
    <rect x="55" y="48" width="80" height="5" rx="2.5" fill="#f3f4f6" />

    <text x="20" y="110" class="section-header" fill="#111827">WINDOWS 11 LIGHT THEME</text>
    <text x="20" y="128" class="preview-label" fill="#4b5563">Widgeten skiftar till ljust glas med mörk text</text>

    <!-- Simulated Widget Floating Over Light Content -->
    <g transform="translate(60, 170)" filter="url(#pill-shadow)">
      <g mask="url(#widget-mask)">
        <!-- Light Translucent Base Plate (Perfect Windows 11 Light Acrylic) -->
        <rect width="240" height="52" rx="8" fill="rgba(249, 250, 251, 0.65)" />
        
        <!-- Live Light-optimized Waves (Slightly deeper/richer colors to keep contrast high) -->
        <g opacity="0.85">
          <path fill="none" stroke="url(#light-blue)" stroke-width="6" stroke-linecap="round">
            <animate attributeName="d" 
                     values="M -10,26 Q 30,6 70,26 T 150,26 T 210,26 T 250,26;
                             M -10,26 Q 30,46 70,26 T 150,26 T 210,26 T 250,26;
                             M -10,26 Q 30,6 70,26 T 150,26 T 210,26 T 250,26" 
                     dur="5s" repeatCount="indefinite"/>
          </path>
          <path fill="none" stroke="url(#light-purple)" stroke-width="4" stroke-linecap="round">
            <animate attributeName="d" 
                     values="M -10,26 Q 40,41 90,26 T 170,26 T 210,26 T 250,26;
                             M -10,26 Q 40,11 90,26 T 170,26 T 210,26 T 250,26;
                             M -10,26 Q 40,41 90,26 T 170,26 T 210,26 T 250,26" 
                     dur="4s" repeatCount="indefinite"/>
          </path>
        </g>
        
        <!-- Inner Overlay and borders -->
        <rect width="240" height="52" rx="8" fill="rgba(255, 255, 255, 0.2)" pointer-events="none" />
        <rect width="240" height="52" rx="8" fill="none" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1" />
        <path d="M 30,1 Q 120,1 210,1" stroke="rgba(255,255,255,0.6)" stroke-width="0.8" fill="none" />
      </g>
      <!-- Center Shimmering Dark Charcoal Text -->
      <text x="120" y="31" class="pill-text-light" text-anchor="middle" filter="url(#shadow-light-text)">Transkriberar...</text>
    </g>

    <!-- Specs annotation -->
    <rect x="20" y="270" width="320" height="50" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.04)" stroke-width="1" />
    <text x="35" y="290" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#4b5563">
      • Bakgrund: <tspan fill="#0284c7" font-weight="bold">rgba(249, 250, 251, 0.65)</tspan> (Ljust Akrylglas)
    </text>
    <text x="35" y="306" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#4b5563">
      • Text: <tspan fill="#111827" font-weight="bold">Mörkt Charcoal Shimmer</tspan> | Kontrast-anpassade vågor
    </text>
  </g>

</svg>
